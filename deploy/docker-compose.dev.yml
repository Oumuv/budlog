name: budlog-dev

services:
  server:
    image: budlog-server:${BUDLOG_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: server.Dockerfile
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./budlog-server.jar
        target: /app/budlog-server.jar
        read_only: true
        bind:
          create_host_path: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRESQL_HOST: ${POSTGRESQL_HOST:?POSTGRESQL_HOST is required}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USER: ${POSTGRESQL_USER:?POSTGRESQL_USER is required}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESQL_PASSWORD is required}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-budlog_dev}
      APP_ACCESS_ENABLED: "false"
      APP_TIMEZONE: ${BUDLOG_TIMEZONE:-Asia/Shanghai}
      DEFAULT_FEEDING_INTERVAL_MIN: ${BUDLOG_FEEDING_INTERVAL_MIN:-180}
      CORS_ALLOWED_ORIGINS: "http://localhost:${BUDLOG_DEV_WEB_PORT:-5174},http://127.0.0.1:${BUDLOG_DEV_WEB_PORT:-5174}"
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8
      TZ: ${BUDLOG_TIMEZONE:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    image: budlog-web:${BUDLOG_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: web.Dockerfile
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./h5
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${BUDLOG_DEV_WEB_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && test -s /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 3s
      retries: 6

  db-tools:
    image: postgres:18-alpine@sha256:3b5fe96c8451bbd84eb372d404f1ca083cd2c87a474e13d2577d1b438c1c18ba
    profiles: ["tools"]
    environment:
      PGHOST: ${POSTGRESQL_HOST:?POSTGRESQL_HOST is required}
      PGPORT: ${POSTGRESQL_PORT:-5432}
      PGUSER: ${POSTGRESQL_USER:?POSTGRESQL_USER is required}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESQL_PASSWORD is required}
      PGDATABASE: ${POSTGRESQL_DATABASE:-budlog_dev}
